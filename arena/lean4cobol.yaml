description: |
  A GnuCOBOL 3.2 port of lean4lean's executable kernel.
  Resource limits return decline. See the repository results and progress audit.
dir: ..
build: nix shell nixpkgs#gnucobol nixpkgs#gcc nixpkgs#python3 -c make
run: |
  ulimit -s unlimited
  exec ./bin/lean4cobol "$IN"
declines:
  - std
  - cedar
  - cslib
  - con-leche
